name: Actualizar noticias reales

on:
  push:
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recoger noticias y avisos reales
        run: python scripts/update_data.py
      - name: Guardar datos actualizados
        run: |
          git config user.name "IncendiosNews Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "Actualizar noticias y alertas"
          git push
