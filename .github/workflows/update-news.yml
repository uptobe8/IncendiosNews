name: Actualizar datos verificados

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: incendios-live-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recoger noticias y alertas verificadas
        run: python scripts/update_feed.py

      - name: Recoger incidencias oficiales DGT
        run: python scripts/export_traffic.py

      - name: Validar ficheros generados
        run: |
          python - <<'PY'
          import json
          for path in ('data/feed.json','data/traffic.json'):
              with open(path, encoding='utf-8') as f:
                  data=json.load(f)
              print(path, 'OK', data.get('generated_at') or data.get('checked_at'), len(data.get('items', data.get('incidents', []))))
          PY

      - name: Publicar datos nuevos
        run: |
          git config user.name "IncendiosNews Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed.json data/traffic.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Datos automáticos $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
