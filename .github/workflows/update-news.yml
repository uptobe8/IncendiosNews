name: Actualizar noticias de incendios

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recoger noticias y fuentes oficiales
        run: python scripts/update_news.py
      - name: Publicar datos nuevos
        run: |
          if git diff --quiet -- data/latest.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "IncendiosNews Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Actualización automática de noticias"
          git push
