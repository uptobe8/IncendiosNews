<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Noticias · Incendios Centro</title><style>
:root{--bg:#f7f7f4;--paper:#fff;--ink:#171a18;--muted:#6d756f;--line:#e4e7e2;--accent:#df6038;--blue:#316fde;--red:#c53b31}html[data-theme=dark]{--bg:#111411;--paper:#1a1e1a;--ink:#f7f7f4;--muted:#aab2ab;--line:#303630}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI",Inter,Arial,sans-serif}.top{height:72px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1180px)/2))}.back{color:var(--ink);text-decoration:none;font-size:13px}.brand{font-size:15px;font-weight:600}.theme{border:1px solid var(--line);background:var(--paper);color:var(--ink);height:38px;border-radius:999px;padding:0 13px;cursor:pointer}.wrap{width:min(1180px,calc(100% - 32px));margin:34px auto 70px}.head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px}.head h1{font-size:clamp(38px,5vw,66px);font-weight:450;letter-spacing:-.05em;margin:0;line-height:1}.head p{margin:11px 0 0;color:var(--muted);font-size:14px}.stamp{font-size:11px;color:var(--muted);text-align:right}.tools{display:grid;grid-template-columns:minmax(240px,1fr) repeat(2,190px);gap:9px;margin:24px 0 22px}.tools input,.tools select{height:48px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:0 14px;font:inherit;font-size:13px;outline:none}.summary{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:11px;color:var(--muted)}.chip strong{color:var(--ink);font-weight:600}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:86px minmax(0,1fr) 165px;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px 18px}.item.official{border-left:4px solid var(--blue)}.item.alert{border-left:4px solid var(--red)}.time{border-right:1px solid var(--line);padding-right:14px}.clock{font-size:19px;font-weight:600}.date{font-size:11px;color:var(--muted);margin-top:3px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}.tag{font-size:9px;text-transform:uppercase;letter-spacing:.07em;font-weight:650;background:#f0f2ef;color:#667067;border-radius:999px;padding:5px 7px}.tag.official{background:#edf3ff;color:#2e64bd}.tag.alert{background:#fff0ee;color:#b74237}html[data-theme=dark] .tag{background:#262c26}html[data-theme=dark] .tag.official{background:#1c2d4b;color:#9bc0ff}html[data-theme=dark] .tag.alert{background:#4a2623;color:#ffaaa2}.title{font-size:16px;font-weight:600;line-height:1.4}.summaryText{font-size:13px;line-height:1.55;color:var(--muted);margin-top:6px}.source{text-align:right}.source strong{font-size:12px;font-weight:600}.town{font-size:11px;color:var(--muted);margin-top:4px}.source a{display:inline-block;margin-top:8px;text-decoration:none;color:var(--ink);font-size:11px;border:1px solid var(--line);padding:6px 8px;border-radius:9px}.empty{background:var(--paper);border:1px dashed var(--line);border-radius:20px;padding:38px;text-align:center;color:var(--muted)}.notice{margin-top:20px;color:var(--muted);font-size:11px;line-height:1.5}@media(max-width:780px){.top{height:64px;padding:0 12px}.brand{display:none}.wrap{width:calc(100% - 18px);margin-top:22px}.head{display:block}.stamp{text-align:left;margin-top:9px}.tools{grid-template-columns:1fr}.item{grid-template-columns:1fr;gap:10px;padding:15px}.time{border-right:0;border-bottom:1px solid var(--line);padding:0 0 8px;display:flex;gap:8px;align-items:center}.date{margin:0}.source{text-align:left}.head h1{font-size:42px}}
</style></head><body>
<header class="top"><a class="back" href="index.html">← Portada visual</a><div class="brand">Incendios Centro</div><button class="theme" id="theme">☾ Modo nocturno</button></header>
<main class="wrap"><section class="head"><div><h1 id="pageTitle">Última hora</h1><p id="pageSub">Noticias y avisos con fuente identificada, ordenados de más reciente a más antiguo.</p></div><div class="stamp" id="stamp">Cargando datos…</div></section>
<section class="tools"><input id="search" type="search" placeholder="Buscar pueblo, carretera, incendio o medio"><select id="province"><option value="all">Todas las provincias</option><option>Madrid</option><option>Ávila</option><option>Toledo</option></select><select id="type"><option value="all">Todo</option><option value="official">Solo avisos oficiales</option><option value="news">Solo noticias</option></select></section>
<div class="summary" id="summary"></div><section class="list" id="list"><div class="empty">Cargando publicaciones…</div></section><div class="notice">Cada entrada enlaza a su fuente original. Esta aplicación informa; ante una emergencia o peligro inmediato llama al 112.</div></main>
<script>
const root=document.documentElement,theme=document.getElementById('theme');if(localStorage.getItem('incendios-theme')==='dark')root.dataset.theme='dark';function paint(){const d=root.dataset.theme==='dark';theme.textContent=d?'☀ Modo claro':'☾ Modo nocturno';document.querySelector('meta[name="theme-color"]').content=d?'#111411':'#ffffff'}theme.onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem('incendios-theme',root.dataset.theme);paint()};paint();
let DATA={items:[]};const $=s=>document.querySelector(s);const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const dt=v=>new Date(v);const time=v=>new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit'}).format(dt(v));const date=v=>new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short'}).format(dt(v)).replace('.','');
const params=new URLSearchParams(location.search);const preProv=params.get('provincia');const preType=params.get('tipo');const topic=params.get('tema');if(preProv)$('#province').value=preProv;if(preType)$('#type').value=preType;if(topic==='carreteras')$('#search').value='carretera';
function filtered(){const q=$('#search').value.trim().toLowerCase(),p=$('#province').value,t=$('#type').value;return (DATA.items||[]).filter(x=>(p==='all'||x.province===p)&&(t==='all'||x.type===t)&&(!q||`${x.title} ${x.summary||''} ${x.town||''} ${x.source||''}`.toLowerCase().includes(q))).sort((a,b)=>dt(b.published)-dt(a.published));}
function render(){const arr=filtered();$('#summary').innerHTML=`<span class="chip"><strong>${arr.length}</strong> publicaciones</span><span class="chip"><strong>${arr.filter(x=>x.type==='official').length}</strong> oficiales</span><span class="chip"><strong>${arr.filter(x=>x.province==='Madrid').length}</strong> Madrid</span><span class="chip"><strong>${arr.filter(x=>x.province==='Ávila').length}</strong> Ávila</span><span class="chip"><strong>${arr.filter(x=>x.province==='Toledo').length}</strong> Toledo</span>`;$('#list').innerHTML=arr.length?arr.map(x=>`<article class="item ${x.type==='official'?'official':''} ${x.severity==='critical'||x.severity==='alert'?'alert':''}"><div class="time"><div class="clock">${time(x.published)}</div><div class="date">${date(x.published)}</div></div><div><div class="tags"><span class="tag ${x.type==='official'?'official':''}">${x.type==='official'?'FUENTE OFICIAL':'NOTICIA'}</span>${x.severity==='critical'||x.severity==='alert'?'<span class="tag alert">ALERTA</span>':''}<span class="tag">${esc(x.province||'')}</span></div><div class="title">${esc(x.title)}</div>${x.summary?`<div class="summaryText">${esc(x.summary)}</div>`:''}</div><div class="source"><strong>${esc(x.source||'')}</strong><div class="town">${esc(x.town||x.province||'')}</div><a href="${esc(x.url||'#')}" target="_blank" rel="noopener noreferrer">Abrir fuente ↗</a></div></article>`).join(''):'<div class="empty">No hay publicaciones reales con estos filtros.</div>';}
async function load(){try{const r=await fetch('data/latest.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();DATA=await r.json();if(DATA.generated_at)$('#stamp').textContent='Actualizado '+new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(DATA.generated_at));else $('#stamp').textContent='Esperando actualización automática';if(preProv)$('#pageTitle').textContent='Incendios en '+preProv;if(preType==='official'){$('#pageTitle').textContent='Avisos oficiales';$('#pageSub').textContent='Solo publicaciones procedentes de organismos públicos.'}if(preType==='news')$('#pageTitle').textContent='Noticias contrastadas';if(topic==='carreteras'){$('#pageTitle').textContent='Carreteras y desplazamientos';$('#pageSub').textContent='Publicaciones que mencionan carreteras, cortes o movilidad.'}render();}catch(e){$('#stamp').textContent='Sin conexión con los datos';$('#list').innerHTML='<div class="empty">No se han podido cargar los datos del repositorio.</div>';}}$('#search').addEventListener('input',render);$('#province').addEventListener('change',render);$('#type').addEventListener('change',render);load();
</script></body></html>
