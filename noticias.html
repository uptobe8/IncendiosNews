<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff">
<title>Noticias en directo · Incendios Centro</title>
<style>
:root{--bg:#f5f6f4;--paper:#fff;--ink:#151916;--muted:#6f7771;--line:#e2e6e1;--accent:#e15732;--red:#c93d33;--blue:#2e6edb;--shadow:0 10px 32px rgba(23,32,25,.07)}html[data-theme=dark]{--bg:#101310;--paper:#191d19;--ink:#f7f8f5;--muted:#a9b1aa;--line:#303630;--shadow:0 15px 40px rgba(0,0,0,.24)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI",Inter,Arial,sans-serif}.top{height:68px;position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1240px)/2))}.top a{color:var(--ink);text-decoration:none;font-size:13px}.brand{font-size:15px;font-weight:600}.theme{height:38px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:0 13px;cursor:pointer}.wrap{width:min(1240px,calc(100% - 28px));margin:28px auto 70px}.head{display:flex;justify-content:space-between;align-items:end;gap:24px}.head h1{margin:0;font-size:clamp(38px,5vw,64px);font-weight:450;letter-spacing:-.05em;line-height:1}.head p{margin:10px 0 0;color:var(--muted);font-size:14px}.stamp{font-size:11px;color:var(--muted);white-space:nowrap}.searchRow{display:grid;grid-template-columns:minmax(320px,1fr) 170px 190px 180px;gap:9px;margin:24px 0 12px}.search,.select{height:50px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:15px;outline:none;font:inherit;font-size:13px}.search{padding:0 16px}.select{padding:0 12px}.sourceRow{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.sourceRow::-webkit-scrollbar{display:none}.sourceChip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:8px 11px;font-size:11px;cursor:pointer}.sourceChip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px;color:var(--muted)}.chip strong{color:var(--ink);font-weight:600}.list{display:grid;gap:11px}.item{display:grid;grid-template-columns:180px minmax(0,1fr) 155px;gap:18px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 1px 0 rgba(0,0,0,.01)}.thumb{width:180px;height:124px;border-radius:16px;object-fit:cover;background:#dfe4df}.body{padding:4px 0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tag{font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;border-radius:999px;padding:5px 7px;background:#eef1ed;color:#637066}.tag.official{background:#edf3ff;color:#2d63bd}.tag.alert{background:#fff0ee;color:#b74237}html[data-theme=dark] .tag{background:#272d27}.title{font-size:18px;font-weight:580;line-height:1.35;letter-spacing:-.015em}.summaryText{font-size:13px;color:var(--muted);line-height:1.55;margin-top:7px}.side{text-align:right;padding:5px 4px 0}.time{font-size:18px;font-weight:600}.date,.source,.town{font-size:11px;color:var(--muted);margin-top:3px}.source{color:var(--ink);font-weight:600;margin-top:13px}.open{display:inline-flex;margin-top:10px;text-decoration:none;color:var(--ink);font-size:11px;border:1px solid var(--line);border-radius:10px;padding:7px 9px}.empty{background:var(--paper);border:1px dashed var(--line);border-radius:20px;padding:45px;text-align:center;color:var(--muted)}.notice{margin-top:18px;font-size:11px;color:var(--muted)}@media(max-width:900px){.searchRow{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.item{grid-template-columns:140px minmax(0,1fr)}.thumb{width:140px}.side{grid-column:2;text-align:left;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.source{margin-top:0}.open{margin-top:0}}@media(max-width:640px){.top{height:62px;padding:0 10px}.brand{display:none}.wrap{width:calc(100% - 16px);margin-top:20px}.head{display:block}.stamp{margin-top:8px}.head h1{font-size:39px}.searchRow{grid-template-columns:1fr}.search{grid-column:auto}.item{grid-template-columns:1fr;padding:10px}.thumb{width:100%;height:190px}.side{grid-column:1}.title{font-size:17px}}
</style>
</head>
<body>
<header class="top"><a href="index.html">← Portada</a><div class="brand">Incendios Centro</div><button class="theme" id="theme">☾ Modo nocturno</button></header>
<main class="wrap">
<section class="head"><div><h1 id="pageTitle">Noticias en directo</h1><p>Busca cualquier pueblo, carretera, incendio, medio o palabra clave.</p></div><div class="stamp" id="stamp">Cargando…</div></section>
<section class="searchRow"><input class="search" id="search" type="search" placeholder="Ej.: Burgohondo, Almorox, M-501, evacuados…"><select class="select" id="province"><option value="all">Todas las provincias</option><option>Madrid</option><option>Ávila</option><option>Toledo</option></select><select class="select" id="type"><option value="all">Noticias + oficiales</option><option value="official">Solo oficiales</option><option value="news">Solo medios</option></select><select class="select" id="period"><option value="24">Últimas 24 horas</option><option value="48">Últimas 48 horas</option><option value="168">Últimos 7 días</option><option value="all">Todo</option></select></section>
<div class="sourceRow" id="sourceRow"></div><div class="summary" id="summary"></div><section class="list" id="list"><div class="empty">Cargando publicaciones…</div></section><div class="notice">Cada resultado abre su publicación original. Ante una emergencia, llama al 112.</div>
</main>
<script>
const root=document.documentElement,theme=document.getElementById('theme');if(localStorage.getItem('incendios-theme')==='dark')root.dataset.theme='dark';function paint(){const d=root.dataset.theme==='dark';theme.textContent=d?'☀ Modo claro':'☾ Modo nocturno';document.querySelector('meta[name="theme-color"]').content=d?'#101310':'#ffffff'}theme.onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem('incendios-theme',root.dataset.theme);paint()};paint();
let DATA={items:[]},sourceFilter='all';const $=s=>document.querySelector(s),esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const dt=v=>new Date(v);const time=v=>new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit'}).format(dt(v));const date=v=>new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short'}).format(dt(v)).replace('.','');
const params=new URLSearchParams(location.search);const preProv=params.get('provincia'),preType=params.get('tipo'),topic=params.get('tema'),preQ=params.get('q');if(preProv)$('#province').value=preProv;if(preType)$('#type').value=preType;if(preQ)$('#search').value=preQ;if(topic==='carreteras')$('#search').value='carretera';
function hasProvince(x,p){return p==='all'||(Array.isArray(x.provinces)?x.provinces.includes(p):String(x.province||'').includes(p))}function filtered(){const q=$('#search').value.trim().toLowerCase(),p=$('#province').value,t=$('#type').value,period=$('#period').value,now=Date.now();return(DATA.items||[]).filter(x=>hasProvince(x,p)&&(t==='all'||x.type===t)&&(sourceFilter==='all'||x.source===sourceFilter)&&(period==='all'||now-dt(x.published).getTime()<=Number(period)*36e5)&&(!q||`${x.title} ${x.summary||''} ${x.town||''} ${x.source||''} ${x.province||''}`.toLowerCase().includes(q))).sort((a,b)=>dt(b.published)-dt(a.published));}
function renderSources(){const sources=[...new Set((DATA.items||[]).map(x=>x.source).filter(Boolean))].sort();$('#sourceRow').innerHTML=`<button class="sourceChip ${sourceFilter==='all'?'active':''}" data-source="all">Todos los medios</button>`+sources.map(s=>`<button class="sourceChip ${sourceFilter===s?'active':''}" data-source="${esc(s)}">${esc(s)}</button>`).join('');document.querySelectorAll('.sourceChip').forEach(b=>b.onclick=()=>{sourceFilter=b.dataset.source;render()})}
function render(){const arr=filtered();renderSources();$('#summary').innerHTML=`<span class="chip"><strong>${arr.length}</strong> resultados</span><span class="chip"><strong>${arr.filter(x=>x.type==='official').length}</strong> oficiales</span>`;$('#list').innerHTML=arr.length?arr.map(x=>`<article class="item"><img class="thumb" src="${esc(x.image||'https://images.unsplash.com/photo-1523712999610-f77fbcfc3843?auto=format&fit=crop&w=800&q=80')}" alt=""><div class="body"><div class="tags"><span class="tag ${x.type==='official'?'official':''}">${x.type==='official'?'FUENTE OFICIAL':'NOTICIA'}</span>${x.severity==='critical'||x.severity==='alert'?'<span class="tag alert">ALERTA</span>':''}<span class="tag">${esc(x.province||'')}</span></div><div class="title">${esc(x.title)}</div>${x.summary?`<div class="summaryText">${esc(x.summary)}</div>`:''}</div><div class="side"><div class="time">${time(x.published)}</div><div class="date">${date(x.published)}</div><div class="source">${esc(x.source||'')}</div><div class="town">${esc(x.town||'')}</div><a class="open" href="${esc(x.url||'#')}" target="_blank" rel="noopener noreferrer">Abrir noticia ↗</a></div></article>`).join(''):'<div class="empty">No hay resultados con estos filtros.</div>';}
async function load(){try{const r=await fetch('data/latest.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();DATA=await r.json();$('#stamp').textContent=DATA.generated_at?'Actualizado '+new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit'}).format(new Date(DATA.generated_at)):'Actualizando';if(preProv)$('#pageTitle').textContent='Incendios en '+preProv;else if(preType==='official')$('#pageTitle').textContent='Avisos oficiales';else if(topic==='carreteras')$('#pageTitle').textContent='Carreteras y desplazamientos';render()}catch(e){$('#stamp').textContent='Sin conexión';$('#list').innerHTML='<div class="empty">No se han podido cargar los datos.</div>'}}
['search','province','type','period'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));load();setInterval(load,60000);
</script></body></html>
